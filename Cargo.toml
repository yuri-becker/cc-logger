[package]
name = "cc-logger"
version = "1.1.0"
edition = "2021"

[[bin]]
name = "cc-logger"

[dependencies]
fantoccini = "0.21.4"
tokio = { version = "1.44.1", features = ["macros", "process", "io-util", "rt-multi-thread"] }
log = "0.4.27"
dotenv = "0.15.0"
pretty_env_logger = "0.5.0"
rand = { version = "0.9.0", features = [] }
serde_json = "1.0.140"
