when:
  - event: [ cron, push, manual ]
steps:
  - name: Generate Tags
    image: ghcr.io/dvjn/woodpecker-docker-tags-plugin
    settings:
      tags: branch
    when:
      - event: [ push ]

  - name: Build and Publish
    image: woodpeckerci/plugin-docker-buildx
    privileged: true
    settings:
      repo: yuribecker/cc-logger
      tags: [ latest ] # .tags file generated by above step overrides this
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password

  - name: Update Description
    image: peterevans/dockerhub-description:4
    environment:
      DOCKERHUB_USERNAME:
        from_secret: docker_username
      DOCKERHUB_PASSWORD:
        from_secret: docker_password
      DOCKERHUB_REPOSITORY: yuribecker/cc-logger
      README_FILEPATH: ./README.md
    when:
      - event: push
        branch: latest

  - name: Send Mail on Failure
    image: deblan/woodpecker-email
    settings:
      dsn:
        from_secret: MAIL_DSN
      from:
        address:
          from_secret: MAIL_FROM_ADDRESS
        name:
          from_secret: MAIL_FROM_NAME
      content:
        subject: "Build for cc-logger failed! ({{ commit.branch }} – {{ commit.sha[0:8] }})"
        body: |
          See <a href="{{ pipeline.url }}">{{ pipeline.url }}</a>.</p>
    when:
      status: [ failure ]